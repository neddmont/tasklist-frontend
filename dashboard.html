<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskList — Dashboard</title>
    <link rel="stylesheet" href="AuthHTML.css" />
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>


    <header class="dashboard-header">
        <div class="header-left">
            <h1>📋 <span class="highlight">TaskList</span></h1>
        </div>
        <div class="header-right">
            <span id="userEmail" class="user-email">user@example.com</span>
            <button id="logoutBtn" class="logout-button">🚪 Выйти</button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="dashboard-main">
        <div class="task-section">
            <div class="task-header">
                <h2>Мои задачи</h2>
                <button id="openCreateTaskBtn" class="create-task-btn">➕ Новая задача</button>
            </div>

            <!-- Список задач -->
            <ul id="taskList" class="task-list">
                <!-- Задачи будут добавляться сюда через JS -->
                <li class="task-item empty-message">Задач пока нет. Создайте первую! 🚀</li>
            </ul>
        </div>
    </main>

    <!-- Модальное окно для создания задачи -->
    <div id="createTaskModal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Создать задачу</h2>
            <form id="createTaskForm">
                <input type="text" id="taskTitle" placeholder="Название задачи" required />
                <button type="submit">➕ Создать</button>
            </form>
        </div>
    </div>

    <script src="Index.js"></script>
</body>
</html>
